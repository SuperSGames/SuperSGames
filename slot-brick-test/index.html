function lose(){sound(220,.04,.3,'sawtooth');pop('스테이지 실패','벽돌이 위험선까지 내려왔어. 발사 각도를 바꿔 다시 도전해봐!',[['같은 스테이지 재도전',()=>resetLevel(),false],['스테이지 선택',chooseStage,true]],`발사 ${st.shots}회 · 점수 ${score.toLocaleString('ko-KR')}`)}
function chooseStage(){const opts=[];for(let n=1;n<=Math.min(LEVEL_COUNT,highest);n++){if(n>1&&n<highest-5&&n%5!==0)continue;opts.push([`${n} 스테이지 ${'★'.repeat(stars[n]||0)}`,()=>{stage=n;resetLevel()},true])}opts.push(['취소',()=>{},true]);pop('스테이지 선택','해금된 스테이지를 선택해 다시 즐길 수 있어. 이전 스테이지 반복 클리어로 코인을 무한 지급하지 않아.',opts,`최고 진행: ${highest}스테이지`)}
function pause(){pop('일시정지','숫자 벽돌을 모두 제거하면 스테이지 클리어. 모든 공은 복잡한 반사 경로로 독립적으로 움직여.',[['계속하기',()=>{},false],['현재 스테이지 재시작',()=>resetLevel(),true],['스테이지 선택',chooseStage,true],[muted?'효과음 켜기':'효과음 끄기',()=>{muted=!muted;pause()},true]])}
$('recallBtn').addEventListener('click',()=>{if(!st||st.phase!=='firing'||st.fired<st.shotTotal)return;st.returned+=st.balls.length;st.balls=[];notice('남은 공을 회수했어');finishVolley()});$('pauseBtn').addEventListener('click',pause);$('stagebtn').addEventListener('click',chooseStage);$('spinBtn').addEventListener('click',spin);
window.__gameTest={state:()=>st&&({phase:st.phase,stage,coins,shots:st.shots,score,shotBalls:st.shotBalls,spinStep:st.spinStep,ballsActive:st.balls.length,bricksAlive:st.bricks.filter(b=>b.alive&&b.kind!=='steel').length,fired:st.fired,returned:st.returned,launcherX:st.launcherX}),shoot:(x=100,y=80)=>{if(st.phase!=='ready')return false;aimAt({x,y});startShot();return true},spin,reset:()=>resetLevel(),setStage:(n)=>{stage=n;resetLevel()},forceTime:(seconds=1)=>{for(let t=0;t<seconds*120;t++)updatePhysics(1/120)},ballPhysics:(p,dt)=>moveBall(p,dt)};
load();scaleQueue();resetLevel();requestAnimationFrame(frame);
})();
</script></body></html>
