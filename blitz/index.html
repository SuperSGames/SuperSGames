<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>냥냥블리츠</title>
<style>
:root {font-family:system-ui,-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;color:#634244;font-synthesis:none}
* {box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden;background:#f5e9de}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation}
#gameViewport {position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#game {position:absolute;width:414px;height:896px;transform-origin:top left;overflow:hidden;background:#fff7ef;box-shadow:0 0 30px #956e7030}
.masthead{height:111px;padding:27px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between;background:#fff4e8;border-bottom:2px solid #f0d8c8}
.brandTitle{font-size:31px;letter-spacing:-1.7px;font-weight:1000;line-height:1.05;color:#db647f;text-shadow:0 2px 0 #fff}
.brandTag{font-size:12px;font-weight:900;color:#aa8791;letter-spacing:1px;padding-left:3px;margin-top:5px}
.iconButton{border:2px solid #f0ced2;background:#fff;min-width:53px;height:44px;border-radius:13px;box-shadow:0 3px 0 #e9cbd1;font-size:15px;font-weight:950;color:#a36c82}
.headerButtons{display:flex;gap:7px;margin-bottom:4px}
.topStats{height:98px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 14px 7px}
.stat{border:2px solid #efd6c7;background:#fff;box-shadow:0 3px 0 #f0dcca;border-radius:15px;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}
.stat .key{color:#af8d81;font-weight:900;font-size:14px}
.stat .num{font-weight:1000;font-size:25px;letter-spacing:-1px;color:#a7676f;font-variant-numeric:tabular-nums}
.stat.emphasis{background:#fff0dc;border-color:#f4d5a3}
.stat.emphasis .num{color:#e17d5c}
.stat.timerStat.danger{background:#ffe7ec;border-color:#f3a7b3;animation:warning .7s infinite alternate}
@keyframes warning{to{filter:brightness(1.08)}}
#notice{height:29px;margin:1px 15px 8px;display:flex;align-items:center;gap:7px}
#speedBox{font-size:13px;white-space:nowrap;font-weight:1000;color:#e47775;min-width:111px}
.track{flex:1;height:13px;border-radius:9px;background:#ecd7cd;border:2px solid #e3bbaf;overflow:hidden}
.trackFill{height:100%;width:100%;background:#e9a96b;transition:width .1s linear}
#statusText{font-size:12px;font-weight:900;min-width:42px;text-align:right;color:#ae7785}
.boardShell{width:396px;height:400px;padding:6px;margin:0 auto;border:3px solid #dcaea5;border-radius:17px;background:#ffe6cf;box-shadow:0 6px 0 #f1d8c2, 0 8px 14px #b88d7b33;position:relative}
#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));touch-action:none;user-select:none;border-radius:10px;overflow:hidden;background:#f7d5bb;position:relative}
.cell{position:relative;display:grid;place-items:center;min-width:0;min-height:0;background:#ffe8d5;transition:background .08s}
.cell:nth-child(odd){background:#fae0c9}
.cell.selected{background:#ffcf83!important;box-shadow:inset 0 0 0 3px #fff3ba;z-index:3}
.cell.hinted{background:#fff5a2!important}
.cell.clearing{animation:clear .19s ease-out forwards}
.cell.dropped img{animation:fall .23s ease-out}
.cell img{position:relative;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.cell .overlaySymbol{position:absolute;z-index:2;inset:auto 0 3px;text-align:center;font-size:22px;font-weight:1000;color:white;text-shadow:0 1px 4px #68414b,0 0 5px #7b4a58;pointer-events:none;line-height:1}
.cell .multiSymbol{background:#f5e6ffdc;color:#8b4cb6;text-shadow:0 1px #fff;border-radius:10px;border:2px solid #cc9ced;inset:2px 3px auto auto;padding:1px 3px;font-size:13px;line-height:1.1}
.cell.flame img{filter:drop-shadow(0 0 3px #ff794a)}
.cell.star img{filter:drop-shadow(0 0 4px #ed79e6)}
.cell.cube img{filter:drop-shadow(0 0 5px #82c5f5)}
@keyframes clear{40%{transform:scale(1.22);opacity:1;filter:brightness(1.7)}100%{opacity:0;transform:scale(.2)}}
@keyframes fall{0%{transform:translateY(-18px);opacity:.65}100%{transform:none;opacity:1}}
.burst{position:absolute;z-index:8;pointer-events:none;font-size:19px;font-weight:1000;color:#f07889;text-shadow:1px 2px 0 #fff;animation:floatScore .85s ease-out forwards}
@keyframes floatScore{to{transform:translateY(-60px) scale(1.2);opacity:0}}
#banner{height:57px;margin:16px 12px 0;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;border:2px solid #f0d5ca;border-radius:17px;box-shadow:0 3px 0 #edd9c9;padding:6px 7px}
#banner b{font-size:17px;color:#ac7482}
#banner small{font-size:12px;color:#ac8b85;font-weight:800}
#banner img{width:41px;height:41px;object-fit:contain}
.actionBar{display:flex;gap:10px;margin:12px 14px 0}
.btn{height:54px;flex:1;border:2px solid #efd1c6;border-radius:16px;background:#fff;color:#b06a78;font-size:17px;font-weight:1000;box-shadow:0 4px 0 #dfc8c1}
.btn.primary{background:#ee7e98;border-color:#dc6c89;color:#fff;box-shadow:0 4px 0 #c9587b;text-shadow:0 1px #ca5872}
.btn:disabled{opacity:.5;filter:saturate(.4);cursor:default}
.bottomNav{position:absolute;bottom:0;width:100%;height:80px;padding:6px 10px 7px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#fff;border-top:2px solid #f0d8cc}
.bottomNav button{border:0;border-radius:13px;background:#fff;font-weight:950;font-size:15px;color:#af8c91}
.bottomNav button.active{background:#fff0f3;color:#dc647e;transform:translateY(4px)}
.bottomNav .navTxt{font-size:22px;display:block;line-height:25px;font-weight:950}
.scrim{position:absolute;inset:0;z-index:21;background:#51384388;display:flex;align-items:center;justify-content:center;padding:17px}
.scrim[hidden]{display:none}
.dialog{width:100%;max-height:78%;overflow:auto;background:#fff9f1;border:3px solid #f2d4c5;border-radius:24px;box-shadow:0 10px 35px #603b484a;padding:23px 18px 19px;text-align:center}
.dialog h2{margin:0 0 8px;font-size:28px;color:#d96885}
.dialog p{font-size:16px;line-height:1.55;color:#986e73;margin:8px 0 14px;font-weight:750}
.bigResult{font-size:42px;font-weight:1000;letter-spacing:-1px;color:#dd7282;margin:10px 0}
.dialog .btn{display:block;width:100%;margin:11px 0 0;flex:none}
.record{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-bottom:1px solid #efd8c9;font-size:15px;font-weight:850}
.record span:last-child{color:#d67388}
.toggleRow{display:flex;justify-content:space-between;align-items:center;padding:13px 1px;border-bottom:1px solid #efd6c8;font-weight:900}
.toggleRow button{border:2px solid #edbcca;background:#fff0f5;border-radius:12px;min-width:92px;padding:7px 10px;font-weight:950;color:#c16b85}
.howto{font-size:14px;text-align:left;line-height:1.7;color:#886876;margin:9px 2px}
#toast{position:absolute;z-index:23;top:44%;left:50%;min-width:115px;transform:translate(-50%,-50%);padding:10px 18px;border-radius:18px;background:#664e60ee;color:white;font-weight:950;font-size:20px;text-align:center;opacity:0;pointer-events:none}
#toast.show{animation:toast .9s ease}
@keyframes toast{15%,75%{opacity:1}100%{opacity:0}}
</style>
</head>

let board=[],score=0,multiplier=1,remaining=60,mode='idle',busy=false,sel=-1,pointer=null,chain=0,lastMatchAt=-1,speedBonus=0,ignite=0,blazingUntil=0,goTimestamp=0,lastFrame=0,accTime=0,tickId=0,token=0,finishPending=false,hintPair=null;
const pick=n=>Math.floor(Math.random()*n);
const clone=o=>({...o});
const pauseSleep=ms=>new Promise(r=>setTimeout(r,ms));
const hasImgError=new Set();
function fit(){const vw=innerWidth,vh=innerHeight,sx=Math.min(1,vw/414),sy=Math.min(sx,vh/896);dom.game.style.transform=`scale(${sx},${sy})`;dom.game.style.left=((vw-414*sx)/2)+'px';dom.game.style.top=((vh-896*sy)/2)+'px';}
addEventListener('resize',fit);addEventListener('orientationchange',fit);addEventListener('pageshow',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();requestAnimationFrame(fit);requestAnimationFrame(()=>requestAnimationFrame(fit));
function point(i){return [Math.floor(i/W),i%W]}
function newTile(color=pick(TYPES.length)){return {color,special:null,multi:false}}
function fmt(v){return Math.round(v).toLocaleString('ko-KR')}
function announce(text){const e=dom.toast;e.textContent=text;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function audio(freq=520,dur=.07){if(!saved.sound)return;try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;if(!audio.ctx)audio.ctx=new Context();const ctx=audio.ctx;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(_){}}
function vibrate(ms=22){if(saved.vibrate&&navigator.vibrate)try{navigator.vibrate(ms)}catch(_){}}
function render(dropped=false){for(let i=0;i<N;i++){
 const cell=cells[i],p=board[i];cell.className='cell'+(i===sel?' selected':'')+(hintPair?.includes(i)?' hinted':'')+(p?.special?' '+p.special:'')+(dropped?' dropped':'');cell.replaceChildren();
 if(!p)continue;const img=document.createElement('img');img.src=ASSETS[p.color];img.alt=TYPES[p.color]+' 블록';img.draggable=false;img.decoding='async';img.onerror=()=>{hasImgError.add(img.src);img.style.display='none';if(!cell.querySelector('.textFallback')){const t=document.createElement('strong');t.className='textFallback';t.textContent=['고양이','쥐','물고기','발','털실'][p.color];t.style.fontSize='11px';cell.append(t);}};cell.append(img);
 if(p.special){const t=document.createElement('div');t.className='overlaySymbol';t.textContent=p.special==='flame'?'✦':p.special==='star'?'✳':'★';cell.append(t)}
 if(p.multi){const t=document.createElement('div');t.className='overlaySymbol multiSymbol';t.textContent='×'+(multiplier+1);cell.append(t)}
 }}
function update(){dom.score.textContent=fmt(score);dom.mult.textContent='×'+multiplier;dom.timer.textContent=String(Math.max(0,Math.ceil(remaining))).padStart(2,'0');dom.timerStat.classList.toggle('danger',remaining<=10&&mode==='running');dom.bar.style.width=Math.max(0,remaining/60*100)+'%';dom.speed.textContent=(performance.now()<blazingUntil?'블레이징! ':'스피드 ')+(speedBonus>0?'+':'')+speedBonus;dom.status.textContent=mode==='idle'?'READY':mode==='running'?'PLAY':mode==='paused'?'PAUSE':'END';dom.play.textContent=mode==='idle'?'게임 시작':mode==='running'||mode==='paused'?'다시하기':'다시 도전';dom.pause.textContent=mode==='paused'?'계속':'정지';}
function groupsOn(b){const runs=[];
 for(let r=0;r<H;r++){let c=0;while(c<W){let start=c;while(c+1<W&&b[r*W+c]&&b[r*W+c+1]&&b[r*W+c].color===b[r*W+c+1].color)c++;if(c-start>=2)runs.push({ids:Array.from({length:c-start+1},(_,k)=>r*W+start+k),axis:'h'});c++;}}
 for(let c=0;c<W;c++){let r=0;while(r<H){let start=r;while(r+1<H&&b[r*W+c]&&b[(r+1)*W+c]&&b[r*W+c].color===b[(r+1)*W+c].color)r++;if(r-start>=2)runs.push({ids:Array.from({length:r-start+1},(_,k)=>(start+k)*W+c),axis:'v'});r++;}}
 const grouped=[];for(const run of runs){let group={ids:new Set(run.ids),runs:[run]};let matches=grouped.filter(g=>[...run.ids].some(i=>g.ids.has(i)));if(matches.length){for(const g of matches){for(const i of g.ids)group.ids.add(i);group.runs.push(...g.runs);grouped.splice(grouped.indexOf(g),1)}}grouped.push(group)}return grouped;
}
function hasMove(b){for(let i=0;i<N;i++){if(!b[i])continue;for(const j of [i+1,i+W]){if(j>=N||(j===i+1&&i%W===W-1)||!b[j])continue;if(b[i].special==='cube'||b[j].special==='cube')return [i,j];if(b[i].color===b[j].color)continue;[b[i],b[j]]=[b[j],b[i]];let yes=groupsOn(b).length>0;[b[i],b[j]]=[b[j],b[i]];if(yes)return [i,j];}}return null}
function createBoard(){for(let attempts=0;attempts<75;attempts++){let b=new Array(N);for(let i=0;i<N;i++){const r=Math.floor(i/W),c=i%W;const bad=new Set();if(c>1&&b[i-1]?.color===b[i-2]?.color)bad.add(b[i-1].color);if(r>1&&b[i-W]?.color===b[i-W*2]?.color)bad.add(b[i-W].color);let good=TYPES.map((_,a)=>a).filter(v=>!bad.has(v));b[i]=newTile(good[pick(good.length)]);}if(hasMove(b))return b;}throw Error('게임판 생성 실패')}
function floating(text,index){const d=document.createElement('div');d.className='burst';d.textContent=text;const [r,c]=point(index);d.style.left=(c+.15)*100/8+'%';d.style.top=(r+.05)*100/8+'%';dom.board.append(d);setTimeout(()=>d.remove(),870)}
function start(){token++;if(tickId)cancelAnimationFrame(tickId);score=0;multiplier=1;remaining=60;mode='running';busy=false;sel=-1;pointer=null;chain=0;lastMatchAt=-1;speedBonus=0;ignite=0;blazingUntil=0;accTime=0;goTimestamp=performance.now();lastFrame=0;finishPending=false;hintPair=null;board=createBoard();render();update();$('bannerTitle').textContent='터뜨릴수록 점수 UP!';$('bannerText').textContent='연속 매칭으로 스피드 보너스 획득';audio(720,.14);vibrate(45);tickId=requestAnimationFrame(tick)}
function tick(now){if(mode!=='running')return;if(!lastFrame)lastFrame=now;const delta=Math.min(250,now-lastFrame);lastFrame=now;remaining=Math.max(0,remaining-delta/1000);if(remaining===0){if(busy){finishPending=true;update();tickId=requestAnimationFrame(tick);return;}finish();return;}if(lastMatchAt>0&&now-lastMatchAt>4200){speedBonus=0;ignite=0;chain=0;}
 update();tickId=requestAnimationFrame(tick)}
function finish(){if(mode==='ended')return;mode='ended';finishPending=false;token++;if(tickId)cancelAnimationFrame(tickId);sel=-1;hintPair=null;busy=false;saved.plays++;let newBest=score>saved.best;if(newBest)saved.best=score;saved.history.unshift({score,at:new Date().toLocaleDateString('ko-KR'),mult:multiplier});saved.history=saved.history.slice(0,10);persist();render();update();$('bannerTitle').textContent=newBest?'새로운 최고 기록!':'60초 도전 완료!';$('bannerText').textContent='이번 점수 '+fmt(score)+'점';audio(880,.15);vibrate(130);resultDialog(newBest)}
function showDialog(html,autoPause=true){if(autoPause&&mode==='running'){mode='paused';lastFrame=0;update();}dom.dialog.innerHTML=html;dom.modal.hidden=false;}
function hideDialog(){dom.modal.hidden=true;setActiveNav('play');if(mode==='paused'&&remaining>0){mode='running';lastFrame=0;tickId=requestAnimationFrame(tick);update();}}
function resultDialog(newBest){showDialog(`<h2>${newBest?'최고 기록 달성!':'게임 종료!'}</h2><p>60초 동안 냥냥블리츠에 도전했어요.</p><div class="bigResult">${fmt(score)}점</div><p>최고 점수 ${fmt(saved.best)}점 · 최대 배율 ×${multiplier}</p><button class="btn primary" id="startAgain">한 번 더 플레이</button><button class="btn" id="resultRecords">기록 보기</button>`,false);$('startAgain').onclick=()=>{dom.modal.hidden=true;setActiveNav('play');start()};$('resultRecords').onclick=recordsDialog}
function setActiveNav(s){document.querySelectorAll('[data-menu]').forEach(el=>el.classList.toggle('active',el.dataset.menu===s))}
function recordsDialog(){setActiveNav('records');let body=saved.history.length?saved.history.map((x,i)=>`<div class="record"><span>${i+1}. ${x.at}</span><span>${fmt(x.score)}점 · ×${x.mult||1}</span></div>`).join(''):'<p>아직 기록이 없어요. 첫 게임에 도전해 보세요!</p>';showDialog(`<h2>나의 기록</h2><p>최고 점수 <strong>${fmt(saved.best)}점</strong> · 플레이 ${saved.plays}회</p>${body}<button class="btn primary" id="closeDialog">게임으로 돌아가기</button>`);$('closeDialog').onclick=hideDialog}
function settingsDialog(){setActiveNav('settings');showDialog(`<h2>설정</h2><div class="toggleRow"><span>효과음</span><button id="soundToggle">${saved.sound?'ON':'OFF'}</button></div><div class="toggleRow"><span>진동</span><button id="vibrationToggle">${saved.vibrate?'ON':'OFF'}</button></div><p>설정은 냥냥블리츠에만 적용됩니다.</p><button class="btn primary" id="closeDialog">돌아가기</button>`);$('soundToggle').onclick=()=>{saved.sound=!saved.sound;persist();$('soundToggle').textContent=saved.sound?'ON':'OFF';audio(650)};$('vibrationToggle').onclick=()=>{saved.vibrate=!saved.vibrate;persist();$('vibrationToggle').textContent=saved.vibrate?'ON':'OFF';vibrate(30)};$('closeDialog').onclick=hideDialog}
function helpDialog(){showDialog(`<h2>냥냥블리츠 게임 방법</h2><div class="howto">블록을 옆 칸으로 밀어 <b>같은 그림 3개 이상</b>을 가로나 세로로 맞추세요.<br>4개 직선 매칭: <b>폭발 블록 ✦</b><br>5개 T/L 매칭: <b>십자 블록 ✳</b><br>5개 직선 매칭: <b>색상 폭발 ★</b><br>빠르게 연속 매칭하면 <b>스피드 보너스</b>가 쌓입니다.<br>특정 대량 폭발 후 나타나는 <b>× 배율 블록</b>을 매칭하면 점수 배율이 상승합니다.<br>제한 시간 <b>60초</b> 동안 최대 점수를 기록하세요!</div><button class="btn primary" id="closeDialog">게임으로 돌아가기</button>`);$('closeDialog').onclick=hideDialog}
function togglePause(){if(mode==='paused'){mode='running';lastFrame=0;tickId=requestAnimationFrame(tick);announce('계속!');update()}else if(mode==='running'){mode='paused';lastFrame=0;announce('일시정지');update()}else if(mode==='idle'){announce('게임 시작을 눌러 주세요')}else{announce('새 게임을 시작해 주세요')}}
function markSpecial(group,prefer){const ids=[...group.ids];const longH=group.runs.some(x=>x.axis==='h'&&x.ids.length>=5),longV=group.runs.some(x=>x.axis==='v'&&x.ids.length>=5);let type=null;if(longH||longV)type='cube';else if(group.runs.some(x=>x.axis==='h')&&group.runs.some(x=>x.axis==='v')&&ids.length>=5)type='star';else if(group.runs.some(x=>x.ids.length>=4))type='flame';if(!type)return null;const target=ids.includes(prefer)?prefer:ids[ids.length-1];return {index:target,type};}
function bonusPulse(now){if(lastMatchAt>=0&&now-lastMatchAt<=3000){chain++;speedBonus=Math.min(1000,chain*100);if(speedBonus===1000){ignite++;if(ignite>=16){blazingUntil=now+10000;ignite=0;announce('블레이징 스피드!')}}}else{chain=0;speedBonus=0;ignite=0;}lastMatchAt=now;}
async function settle(initial=null,prefer=-1,fromSwap=true){const myToken=token;busy=true;let cascade=0,pending=initial;
 while(mode!=='ended'&&token===myToken){const groups=groupsOn(board);if((!pending||pending.size===0)&&groups.length===0)break;
 const clear=pending&&pending.size?new Set(pending):new Set();for(const g of groups)for(const i of g.ids)clear.add(i);
 const protect=new Map();if(fromSwap&&cascade===0&&groups.length){for(const g of groups){const special=markSpecial(g,prefer);if(special&&board[special.index]?.special!=='cube'){protect.set(special.index,special.type);clear.delete(special.index)}}}
 // Expand special block reactions until none remain.
 const visited=new Set(),queue=[...clear];while(queue.length){const idx=queue.pop();if(visited.has(idx)||!board[idx])continue;visited.add(idx);const p=board[idx];if(p.special==='flame'){const [r,c]=point(idx);for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<H&&nc>=0&&nc<W){const j=nr*W+nc;if(!clear.has(j)){clear.add(j);queue.push(j)}}}}else if(p.special==='star'){const [r,c]=point(idx);for(let j=0;j<N;j++)if(Math.floor(j/W)===r||j%W===c){if(!clear.has(j)){clear.add(j);queue.push(j)}}}else if(p.special==='cube'){const t=pick(TYPES.length);for(let j=0;j<N;j++)if(board[j]?.color===t){if(!clear.has(j)){clear.add(j);queue.push(j)}}}}
 if(clear.size===0)break;
 let gained=0,count=0,removedMulti=0;for(const i of clear){const p=board[i];if(!p)continue;count++;if(p.multi)removedMulti++;cells[i].classList.add('clearing');gained+=(p.special?180:100);}
 if(!count)break;const now=performance.now();if(cascade===0)bonusPulse(now);gained=(gained+speedBonus)*multiplier*Math.max(1,1+cascade*.5);score+=Math.round(gained);if(removedMulti){multiplier=Math.min(8,multiplier+removedMulti);announce('배율 UP! ×'+multiplier);}const focus=prefer>=0?prefer:[...clear][0];floating('+'+fmt(gained),Math.max(0,focus));if(count>=7){vibrate(65);audio(760+Math.min(cascade,5)*110,.14)}else{vibrate(18);audio(520+Math.min(cascade,5)*85)}update();
 await pauseSleep(120);if(token!==myToken||mode==='ended')return;
 for(const i of clear)board[i]=null;for(const [i,type] of protect)if(board[i]){board[i].special=type;board[i].multi=false;}
 for(let c=0;c<W;c++){let write=H-1;for(let r=H-1;r>=0;r--){const p=board[r*W+c];if(p){board[write*W+c]=p;if(write!==r)board[r*W+c]=null;write--;}}while(write>=0)board[write--*W+c]=newTile()}
 render(true);await pauseSleep(95);if(token!==myToken||mode==='ended')return;
 cascade++;fromSwap=false;prefer=-1;pending=null;
 if(count>=12&&multiplier<8){const options=board.map((p,i)=>p.special||p.multi?-1:i).filter(i=>i>=0);if(options.length)board[options[pick(options.length)]].multi=true}
 if(cascade>25){board=createBoard();break;}
 }
 if(token!==myToken)return;busy=false;if(finishPending||remaining<=0){finish();return;}if(!hasMove(board)){board=createBoard();announce('게임판 새로고침!')}render();update();}
async function swap(i,j){if(mode!=='running'||busy||!board[i]||!board[j])return;const [r,c]=point(i),[rr,cc]=point(j);if(Math.abs(r-rr)+Math.abs(c-cc)!==1){sel=j;render();return;}hintPair=null;sel=-1;
 if(board[i].special==='cube'||board[j].special==='cube'){
  const cube=board[i].special==='cube'?i:j,other=cube===i?j:i,color=board[other].color;const indexes=new Set([cube]);for(let a=0;a<N;a++)if(board[a]?.color===color)indexes.add(a);await settle(indexes,other,true);return;
 }
 [board[i],board[j]]=[board[j],board[i]];render();const groups=groupsOn(board);if(groups.length===0){busy=true;audio(200,.06);await pauseSleep(110);[board[i],board[j]]=[board[j],board[i]];busy=false;sel=-1;render();return;}
 // Only matches involving a moved tile are considered a valid swap.
 const matchMoved=groups.some(g=>g.ids.has(i)||g.ids.has(j));if(!matchMoved){busy=true;await pauseSleep(110);[board[i],board[j]]=[board[j],board[i]];busy=false;render();return;}
 await settle(null,j,true);
}
function coords(ev){const rect=dom.board.getBoundingClientRect();const c=Math.floor((ev.clientX-rect.left)/rect.width*W),r=Math.floor((ev.clientY-rect.top)/rect.height*H);if(c<0||c>=W||r<0||r>=H)return -1;return r*W+c;}
dom.board.addEventListener('pointerdown',ev=>{if(mode!=='running'||busy||ev.button!==0)return;ev.preventDefault();pointer={id:ev.pointerId,start:coords(ev),x:ev.clientX,y:ev.clientY};try{dom.board.setPointerCapture(ev.pointerId)}catch(_){}});
dom.board.addEventListener('pointerup',ev=>{if(!pointer||pointer.id!==ev.pointerId)return;const p=pointer;pointer=null;let target=coords(ev);const rect=dom.board.getBoundingClientRect();const dx=(ev.clientX-p.x)/(rect.width/W),dy=(ev.clientY-p.y)/(rect.height/H);if(Math.max(Math.abs(dx),Math.abs(dy))>.27){let [r,c]=point(p.start);if(p.start<0)return;if(Math.abs(dx)>Math.abs(dy))c+=Math.sign(dx);else r+=Math.sign(dy);target=r>=0&&r<H&&c>=0&&c<W?r*W+c:-1;if(target>=0)void swap(p.start,target);return;}
 if(target<0)return;if(sel>=0&&sel!==target){void swap(sel,target)}else{sel=sel===target?-1:target;render()}});
dom.board.addEventListener('pointercancel',()=>{pointer=null});
dom.board.addEventListener('contextmenu',e=>e.preventDefault());
function hint(){if(mode!=='running'){announce('먼저 게임을 시작해 주세요');return;}if(busy)return;const pair=hasMove(board);if(!pair){board=createBoard();render();return;}hintPair=pair;render();setTimeout(()=>{hintPair=null;render()},1300)}
$('playBtn').onclick=()=>{if(mode==='running'||mode==='paused'){showDialog(`<h2>새 게임을 시작할까요?</h2><p>현재 게임 기록은 저장되지 않습니다.</p><button class="btn primary" id="confirmRestart">새로 시작</button><button class="btn" id="cancelRestart">취소</button>`);$('confirmRestart').onclick=()=>{dom.modal.hidden=true;start()};$('cancelRestart').onclick=hideDialog;}else start()};
$('hintBtn').onclick=hint;$('helpBtn').onclick=helpDialog;$('pauseBtn').onclick=togglePause;
document.querySelectorAll('[data-menu]').forEach(e=>e.onclick=()=>{const k=e.dataset.menu;if(k==='play'){if(!dom.modal.hidden)hideDialog()}else if(k==='records')recordsDialog();else settingsDialog()});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!dom.modal.hidden){hideDialog();return}if(ev.key===' '){ev.preventDefault();if(dom.modal.hidden)togglePause();return}if(!dom.modal.hidden||mode!=='running'||busy)return;let [r,c]=point(Math.max(0,sel));let j=-1;if(ev.key==='ArrowUp')j=(r-1)*W+c;else if(ev.key==='ArrowDown')j=(r+1)*W+c;else if(ev.key==='ArrowLeft')j=r*W+c-1;else if(ev.key==='ArrowRight')j=r*W+c+1;else if(ev.key==='Enter'){sel=sel<0?0:sel;render();}if(j>=0&&j<N){if(sel>=0&&sel!==j)void swap(sel,j);else{sel=j;render()}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running'){mode='paused';lastFrame=0;update()}});
board=createBoard();render();update();dom.bannerText.textContent=saved.best?'최고 기록 '+fmt(saved.best)+'점 · 이번에는 더 높이!':'블록을 밀거나 눌러 3개 이상 맞춰요';
// Minimal inspection interface for automated functional tests; does not expose saved game data.
Object.defineProperty(window,'__NYANG_BLITZ_DEBUG__',{value:{get:()=>({mode,busy,remaining,score,multiplier,board:board.map(clone),moves:hasMove(board),matches:groupsOn(board).length}),start,finish,swap,hint,makeBoard:createBoard},writable:false});
})();
</script>
