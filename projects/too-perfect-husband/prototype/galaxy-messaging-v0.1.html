background:#dceadc;color:#4b8552}.avatar.blue{background:#dfe9f8;color:#436ab3}.avatar.gray{background:#e7e7e7;color:#4f545a}.kakao-list .conversation{border-bottom:0;padding-top:11px;padding-bottom:11px}.talk-tabs{height:52px;border-top:1px solid #ededed;display:flex;align-items:center;justify-content:space-around;flex:0 0 52px;background:#fff;color:#aaa;font-size:22px}.talk-tab{border:0;background:none;color:inherit;flex:1;padding:9px}.talk-tab.selected{color:#252525}.talk-tab small{font-size:9px;display:block}

<div id="status" class="home"><span>9:41</span><div class="status-right"><svg viewBox="0 0 24 24"><path d="M2 19h3v-4H2zm5 0h3v-8H7zm5 0h3V7h-3zm5 0h3V3h-3z"/></svg><svg viewBox="0 0 24 24"><path d="M1 9q11-11 22 0l-3 4q-8-7-16 0zm8 8q3-3 6 0l-3 4z"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="7" width="13" height="10" rx="1"/><rect x="22" y="9" width="2" height="6" rx="1"/></svg></div></div>

<script>
(function(){'use strict';
const G_W=414,G_H=896,game=document.getElementById('game'),viewport=document.getElementById('gameViewport');
const s=document.getElementById('screen'),bar=document.getElementById('status'),nav=document.getElementById('navigation');
const portrait=document.getElementById('portraitNotice');
const state={app:'home',view:'home',thread:null,modal:null,query:'',toast:null,previous:'home',sent:{},saved:[],searchMode:false};
const sms=[
{id:'husband',name:'남편',avatar:'남',tone:'blue',time:'오후 8:14',unread:1,msgs:[{me:false,text:'여보, 나 오늘 회사 일 때문에 밤늦게 들어가. 미안해.',time:'오후 8:14',evidence:'남편이 야근한다고 말한 날짜와 시간을 기록했습니다.'},{me:true,text:'알았어. 저녁은 먹었지?',time:'오후 8:16'},{me:false,text:'응. 사랑해 ❤️',time:'오후 8:17'}]},
{id:'unknown',name:'010-82**-19**',avatar:'?',tone:'gray',time:'오후 7:28',unread:1,msgs:[{me:false,text:'오늘도 같은 곳으로 예약해 두었습니다. 자세한 내용은 확인 부탁드립니다.',time:'오후 7:28',evidence:'발신 번호와 예약 시간을 단서에 저장했습니다.'}]},
{id:'hospital',name:'한빛병원',avatar:'+',tone:'green',time:'어제',unread:0,msgs:[{me:false,text:'진료 예약 관련 안내드립니다. 예약 내역은 병원에 문의해 주세요.',time:'어제 오후 3:42',evidence:'남편의 병원 관련 기록을 발견했습니다. 불륜의 증거인지는 아직 알 수 없습니다.'}]}
];
const kakao=[
{id:'friend',name:'미정',avatar:'미',tone:'pink',time:'오후 9:02',unread:2,msgs:[{me:false,text:'야, 남편 또 늦는대?',time:'오후 8:44',evidence:null},{me:true,text:'응. 또 야근이라네.',time:'오후 8:45'},{me:false,text:'무슨 일이든 혼자 끙끙 앓지 마. 내가 같이 알아봐 줄게.',time:'오후 9:02',evidence:'미정은 아내의 조사를 돕겠다고 약속했습니다.'}]},
{id:'husband',name:'여보 ❤️',avatar:'남',tone:'blue',time:'오후 8:15',unread:0,msgs:[{me:false,text:'우리 공주님 오늘 잘 잤어? 내일은 아빠가 꼭 놀아줄게.',time:'오후 8:01',evidence:'남편은 딸과 내일 함께 시간을 보내기로 했습니다.'},{me:true,text:'약속 꼭 지켜. 하루 종일 기다렸어.',time:'오후 8:05'},{me:false,text:'당연하지. 우리 딸한테는 뭐든 해 줄 거야.',time:'오후 8:15'}]},
{id:'mother',name:'엄마',avatar:'엄',tone:'violet',time:'어제',unread:0,msgs:[{me:false,text:'요즘 얼굴이 안 좋더라. 무슨 일 있니?',time:'어제 오후 9:01'}]}
];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function icon(t){return t==='sms'?'✉':'●';}
function threads(){return state.app==='sms'?sms:kakao;}
function selected(){return threads().find(x=>x.id===state.thread);}
function toast(txt){state.toast=txt;render();}
function go(app,view='list',thread=null){state.app=app;state.view=view;state.thread=thread;state.modal=null;state.query='';state.searchMode=false;render();}
function header(typ,name){return `<div class="appbar ${typ==='kakao'?'kakao':''}"><button class="back" data-action="back" aria-label="뒤로">‹</button>${name?`<span class="name">${esc(name)}</span>`:`<span class="name">${typ==='kakao'?'채팅':'메시지'}</span>`}<button class="roundicon" data-action="search" aria-label="검색">⌕</button><button class="roundicon" data-action="menu" aria-label="더보기">☰</button></div>`;}
function home(){return `<div class="scene home-scene"><div class="home-header"><div class="home-meta">DRAMA · UI PREVIEW 0.1</div><h1>너무 완벽한 내 남편</h1><div class="home-sub">당신은 누구와 살고 있나요?</div></div><div class="story-panel"><div class="story-time">금요일 · 오후 8시 14분</div>식탁 위에 식어 버린 저녁이 놓여 있다.<div class="quoted">“여보, 오늘도 늦을 것 같아.”</div>그 순간, 휴대폰 화면이 켜졌다.</div><div class="notif-label">방금 도착한 알림 · 눌러서 확인</div><button class="notification" data-open="sms"><span class="notif-icon">${icon('sms')}</span><span class="notif-content"><strong>메시지 · 남편</strong><p>나 오늘 회사 일 때문에 늦게 들어가.</p></span><span>›</span></button><button class="notification" data-open="kakao"><span class="notif-icon talk">TALK</span><span class="notif-content"><strong>카카오톡 · 미정</strong><p>야, 남편 또 늦는대?</p></span><span>›</span></button><div class="apps"><button class="appentry" data-open="sms"><span class="appicon">✉</span>메시지</button><button class="appentry" data-open="kakao"><span class="appicon talk">TALK</span>카카오톡</button></div></div>`;}
function list(){const isK=state.app==='kakao', data=threads(); let filtered=data.filter(x=>(x.name+x.msgs.map(m=>m.text).join(' ')).includes(state.query));return `<div class="scene ${isK?'kakao-list':''}">${header(state.app,'')}<div class="msglist">${!isK?'<div class="list-title">메시지</div>':''}${state.searchMode?`<div class="searchbar"><input id="search-input" placeholder="대화 검색" value="${esc(state.query)}" style="border:0;outline:0;background:transparent;flex:1;font-size:14px"/></div>`:isK?'<div style="height:14px"></div>':'<div class="searchbar">⌕　대화 검색</div>'}${filtered.map(x=>`<button class="conversation" data-thread="${esc(x.id)}"><span class="avatar ${x.tone}">${esc(x.avatar)}</span><span class="txt"><h3>${esc(x.name)}</h3><p>${esc(x.msgs[x.msgs.length-1].text)}</p></span><span class="conv-meta">${esc(x.time)}${x.unread?`<span class="unread">${x.unread}</span>`:''}</span></button>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}</div>${isK?'<div class="talk-tabs"><button class="talk-tab" data-action="friendstab">♙<small>친구</small></button><button class="talk-tab selected">▣<small>채팅</small></button><button class="talk-tab" data-action="more">···<small>더보기</small></button></div>':''}</div>`;}
function chat(){const isK=state.app==='kakao',t=selected();if(!t)return list();const sent=state.sent[`${state.app}:${t.id}`]||[];const msgs=[...t.msgs,...sent]; return `<div class="scene">${header(state.app,t.name)}<div class="chat ${isK?'kakao':'sms'}" id="chat-scroll"><div class="day-marker ${isK?'kakao':''}">${isK?'2026년 11월 3일 화요일':'오늘 · 11월 3일'}</div>${msgs.map((m,i)=>`<div class="bubble-row ${m.me?'mine':'theirs'} ${isK?'kakao':'sms'}">${isK&&!m.me?`<span class="avatar ${t.tone}">${esc(t.avatar)}</span>`:''}${!m.me?'':`<span class="bubble-time">${esc(m.time)}</span>`}<div class="bubble-wrap ${m.me?'':'incoming'}">${isK&&!m.me?`<div class="bubble-sender">${esc(t.name)}</div>`:''}<button class="bubble ${isK?'kakao':'sms'} ${m.me?'mine':'theirs'}" data-message="${i}" aria-label="메시지 자세히 보기">${esc(m.text)}</button></div>${!m.me?`<span class="bubble-time">${esc(m.time)}</span>`:''}</div>`).join('')}</div><div class="composer ${isK?'kakao':''}"><button class="plus" data-action="attach" aria-label="첨부">＋</button><input class="typearea" id="composer-input" autocomplete="off" placeholder="${isK?'메시지 입력':'문자 메시지'}"/><button class="send ${isK?'kakao':''}" data-action="send">${isK?'전송':'➤'}</button></div></div>`;}
function sheet(){if(!state.modal)return '';const m=state.modal;return `<div class="sheet-cover" data-action="dismiss"><div class="sheet" data-stop="1">${m.kind==='message'?`<div class="evidence-tag">대화 자세히 보기</div><h2>${esc(m.from)}</h2><p>“${esc(m.text)}”</p>${m.evidence?`<p><b>확인한 내용</b><br>${esc(m.evidence)}</p><button class="sheetbutton primary" data-action="save">${state.saved.includes(m.evidence)?'이미 기록한 단서':'단서 기록하기'}</button>`:''}<button class="sheetbutton" data-action="dismiss">닫기</button>`:`<h2>${esc(m.title)}</h2><p>${esc(m.body)}</p><button class="sheetbutton primary" data-action="dismiss">확인</button>`}</div></div>`;}
function render(){bar.className=state.app==='home'?'home':state.app==='kakao'?'kakao':'';nav.className=bar.className; s.innerHTML=(state.app==='home'?home():state.view==='chat'?chat():list())+sheet()+(state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:'');if(state.view==='chat'){const chatEl=document.getElementById('chat-scroll');if(chatEl)chatEl.scrollTop=chatEl.scrollHeight;} }
function back(){if(state.modal){state.modal=null;render();return;}if(state.app==='home')return;if(state.view==='chat'){go(state.app,'list');return;}go('home','home');}
function clickAction(el){if(!el)return;const a=el.dataset.action;if(el.dataset.open){go(el.dataset.open,'list');return;}if(el.dataset.thread){go(state.app,'chat',el.dataset.thread);return;}if(el.hasAttribute('data-message')){const t=selected();if(!t)return;const m=[...t.msgs,...(state.sent[`${state.app}:${t.id}`]||[])][Number(el.dataset.message)];state.modal={kind:'message',text:m.text,from:m.me?'나':t.name,evidence:m.evidence};render();return;}if(el.dataset.nav==='home'||el.dataset.nav==='recent'){go('home','home');return;}if(el.dataset.nav==='back'){back();return;}switch(a){case 'back':back();break;case 'menu':state.modal={title:'대화 메뉴',body:'갤럭시 앱의 메뉴 위치와 버튼 구성을 재현한 UI 시안입니다. 게임 본편에서는 검색과 증거 확인 기능이 연결됩니다.'};render();break;case 'search':state.searchMode=!state.searchMode;render();break;case 'send':{const input=document.getElementById('composer-input');const txt=input?.value?.trim();if(!txt)return;const k=`${state.app}:${state.thread}`;if(!state.sent[k])state.sent[k]=[];state.sent[k].push({me:true,text:txt,time:'오후 9:41'});render();break;}case 'attach':state.modal={title:'첨부',body:'사진, 파일, 연락처 등을 확인하는 게임 장면은 실제 스토리 상황에서만 열리도록 연결합니다.'};render();break;case 'save':{const ev=state.modal?.evidence;if(ev&&!state.saved.includes(ev))state.saved.push(ev);state.modal=null;state.toast='단서가 기록되었습니다';render();break;}case 'friendstab':state.modal={title:'친구',body:'이 시안에서는 채팅 목록과 개별 대화 화면을 확인할 수 있습니다.'};render();break;case 'more':state.modal={title:'더보기',body:'실제 게임에서는 카카오톡 채팅방에서 필요한 기능을 자연스럽게 이어 붙입니다.'};render();break;case 'dismiss':state.modal=null;render();break;}}
s.addEventListener('click',e=>{const t=e.target.closest('button,[data-action]');if(!t)return;if(t.dataset.stop==='1')return;if(t.classList.contains('sheet')||t.closest('.sheet')&&!t.dataset.action)return;clickAction(t)});
nav.addEventListener('click',e=>clickAction(e.target.closest('button')));
s.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='composer-input'){e.preventDefault();clickAction({dataset:{action:'send'}})}if(e.key==='Escape')back()});
s.addEventListener('input',e=>{if(e.target.id==='search-input'){const value=e.target.value;state.query=value;const data=threads();const listWrap=s.querySelector('.msglist');const rows=listWrap.querySelectorAll('.conversation');rows.forEach(row=>{const t=data.find(a=>a.id===row.dataset.thread);row.style.display=t&&(t.name+t.msgs.map(m=>m.text).join(' ')).includes(value)?'flex':'none';});}});
function viewportVal(v,fallback){return Number.isFinite(v)&&v>=100?v:fallback;}
function getSize(){let w=viewportVal(document.documentElement.clientWidth,0);if(!w)w=viewportVal(window.innerWidth,0);if(!w)w=viewportVal(window.visualViewport?.width,414);let h=viewportVal(document.documentElement.clientHeight,0);if(!h)h=viewportVal(window.innerHeight,0);if(!h)h=viewportVal(window.visualViewport?.height,896);return {w,h};}
function fitGame(){const {w,h}=getSize();const sx=Math.min(1,w/G_W),sy=Math.min(sx,h/G_H);game.style.left=`${Math.max(0,(w-G_W*sx)/2)}px`;game.style.top=`${Math.max(0,(h-G_H*sy)/2)}px`;game.style.transform=`scale(${sx},${sy})`;if(game.style.display==='none')game.style.display='flex';game.style.visibility='visible';game.style.opacity='1';portrait.style.display=w>h?'flex':'none';}
function scheduleFits(){requestAnimationFrame(()=>requestAnimationFrame(fitGame));[0,80,250,700,1500].forEach(ms=>setTimeout(fitGame,ms));}
let booted=false;function boot(){if(booted)return;booted=true;render();scheduleFits();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();window.addEventListener('load',scheduleFits);window.addEventListener('pageshow',scheduleFits);window.addEventListener('resize',fitGame);window.addEventListener('orientationchange',scheduleFits);window.visualViewport?.addEventListener('resize',fitGame);
})();
</script>
</body>
